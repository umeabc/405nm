server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端的上传上限保持一致；导出包走的是响应体，不受此限制。
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 只反代 /api 前缀 —— 不要写成 /api/，否则会把 /api 本身漏掉。
    location /api/ {
        # 用变量形式的 proxy_pass + resolver：nginx 会在**每次请求**重新解析 backend，
        # 而不是启动时解析一次就缓存住容器 IP。
        # 少了这两行，后端容器一重建（换了 IP）前端就会全站 502，且必须连前端一起重建才恢复。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 抓取与导出可能跑很久；导出包动辄几百 MB，关掉缓冲避免 nginx 吃内存。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 带 hash 的静态资源可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端路由：未命中的路径一律回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
